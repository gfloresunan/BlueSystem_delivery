<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueSystem - LiveMap Visual Excellence Test Fixture</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MapLibre GL JS & Leaflet MapLibre Plugin for OpenFreeMap Vector Basemaps -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <style>
        .leaflet-container { background: #f8fafc !important; font-family: 'Inter', sans-serif; }
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            border-radius: 14px !important;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(51, 65, 85, 0.5) !important;
        }
        .leaflet-bar a {
            background-color: transparent !important;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4) !important;
            color: #f1f5f9 !important;
            width: 34px !important;
            height: 34px !important;
            line-height: 34px !important;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(8px) !important;
            color: #94a3b8 !important;
            border-radius: 8px !important;
            padding: 3px 8px !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: #818cf8 !important; }
        .bs-cluster-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            font-weight: 900;
            color: #ffffff;
        }
        .bs-cluster-small {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.35);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col p-4 font-sans select-none">
    <!-- Header -->
    <div class="flex items-center justify-between bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-2xl mb-4 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-xl font-black">
                🗺️
            </div>
            <div>
                <h1 class="text-base font-black text-white">LiveMap Visual Excellence 2.0 — Test Fixture</h1>
                <p class="text-xs text-slate-400">OpenFreeMap Liberty Vector Basemap + Leaflet 1.9.4 Native Overlays</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span id="testStatusBadge" class="px-3 py-1 rounded-full text-xs font-black bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                INITIALIZING...
            </span>
        </div>
    </div>

    <!-- Map Container -->
    <div class="flex-1 bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden relative shadow-2xl">
        <div id="testMapContainer" class="w-full h-full"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const statusBadge = document.getElementById('testStatusBadge');
            try {
                // Initialize Leaflet Map centered on Managua, Nicaragua
                const map = L.map('testMapContainer', {
                    zoomControl: true,
                    attributionControl: true,
                    maxZoom: 19
                }).setView([12.1364, -86.2514], 14);

                let vectorLoaded = false;
                if (typeof L.maplibreGL === 'function' && typeof maplibregl !== 'undefined') {
                    try {
                        L.maplibreGL({
                            style: 'https://tiles.openfreemap.org/styles/liberty',
                            attribution: '&copy; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
                        }).addTo(map);
                        vectorLoaded = true;
                        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                        statusBadge.textContent = '🟢 OPENFREEMAP LIBERTY VECTOR ACTIVE (0 WATERMARK)';
                        console.log("[TEST_FIXTURE] OpenFreeMap Liberty vector layer added successfully.");
                    } catch (glErr) {
                        console.warn("[TEST_FIXTURE] MapLibre GL layer failed:", glErr);
                    }
                }

                if (!vectorLoaded) {
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);
                    statusBadge.className = 'px-3 py-1 rounded-full text-xs font-black bg-amber-500/20 text-amber-400 border border-amber-500/30';
                    statusBadge.textContent = '🟡 OSM RASTER FALLBACK ACTIVE';
                }

                // Add Demonstration Leaflet Overlays to verify overlay stacking and clarity
                const clusterGroup = L.markerClusterGroup({
                    iconCreateFunction: (cluster) => {
                        return L.divIcon({
                            html: `<div class="bs-cluster-badge bs-cluster-small" style="width: 36px; height: 36px; font-size: 12px;">${cluster.getChildCount()}</div>`,
                            className: 'custom-cluster-marker',
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        });
                    }
                }).addTo(map);

                // Sample Store Marker
                const storeIcon = L.divIcon({
                    html: `<div class="relative flex items-center justify-center"><div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-900 border-2 border-white text-white shadow-xl flex items-center justify-center font-bold text-base">🏪</div></div>`,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });
                clusterGroup.addLayer(L.marker([12.1364, -86.2514], { icon: storeIcon }));

                // Sample Courier Marker with Direction
                const courierIcon = L.divIcon({
                    html: `<div class="relative flex items-center justify-center"><div class="w-11 h-11 rounded-2xl bg-slate-900 border-2 border-emerald-400 text-white shadow-2xl flex items-center justify-center text-lg">🛵</div></div>`,
                    iconSize: [44, 44],
                    iconAnchor: [22, 22]
                });
                L.marker([12.1400, -86.2550], { icon: courierIcon }).addTo(map);

                // Sample Route Polyline
                L.polyline([[12.1364, -86.2514], [12.1400, -86.2550]], {
                    color: '#6366f1',
                    weight: 5,
                    opacity: 0.85
                }).addTo(map);

            } catch (err) {
                console.error("[TEST_FIXTURE] Error:", err);
                statusBadge.className = 'px-3 py-1 rounded-full text-xs font-black bg-rose-500/20 text-rose-400 border border-rose-500/30';
                statusBadge.textContent = '🔴 ERROR: ' + err.message;
            }
        });
    </script>
</body>
</html>
