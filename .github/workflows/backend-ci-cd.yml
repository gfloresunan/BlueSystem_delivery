name: BlueSystem Enterprise Backend CI/CD Pipeline

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

jobs:
  validate_and_test:
    name: 🧪 Validate, Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd functions
          npm run build

      - name: Run Enterprise Backend Test Suite (191 Tests)
        run: |
          cd functions
          npm test

  deploy_staging:
    name: 🚀 Deploy to Staging Environment
    needs: validate_and_test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Pre-flight Staging Verification & Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️ No se detectaron credenciales para staging (FIREBASE_TOKEN). Despliegue de staging omitido con seguridad."
            exit 0
          fi
          echo "🔍 Desplegando a Staging (bluesystem-7c9af-staging)..."
          npx firebase-tools@13.31.0 deploy --project bluesystem-7c9af-staging --only functions,firestore:rules,firestore:indexes,storage --token "$FIREBASE_TOKEN"

  deploy_production:
    name: 🛡️ Deploy to Production (Manual Approval Gate)
    needs: validate_and_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Deploy Firebase Production Infrastructure
        run: |
          npx firebase-tools@13.31.0 deploy --project bluesystem-7c9af --only functions,firestore:rules,firestore:indexes,storage --token "${{ secrets.FIREBASE_TOKEN }}"
