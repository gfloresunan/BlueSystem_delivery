name: BlueSystem Enterprise Backend CI/CD Pipeline

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Entorno de despliegue explícito (staging o production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm_production:
        description: 'Escriba "CONFIRM_PROD" para autorizar despliegue productivo (ADR-014)'
        required: false
        default: ''
        type: string

jobs:
  validate_and_test:
    name: 🧪 Validate, Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd functions
          npm run build

      - name: Run Enterprise Backend Test Suite (191 Tests)
        run: |
          cd functions
          npm test

  deploy_staging:
    name: 🚀 Deploy to Staging Environment
    needs: validate_and_test
    # Distingue explícitamente:
    # 1. Push directo a ramas staging o develop
    # 2. Invocación manual vía workflow_dispatch dirigida explícitamente a 'staging'
    # (Un workflow_dispatch hacia 'production' ejecutado desde develop/staging NO activará staging)
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Pre-flight Staging Verification & Deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "❌ ERROR: No se detectó el secreto FIREBASE_TOKEN para staging. Despliegue abortado."
            exit 1
          fi
          echo "🔍 Desplegando a Staging (bluesystem-7c9af-staging)..."
          npx firebase-tools@13.31.0 deploy --project bluesystem-7c9af-staging --only functions,firestore:rules,firestore:indexes,storage --token "$FIREBASE_TOKEN"

  deploy_production:
    name: 🛡️ Deploy to Production (Manual Authorization Gate)
    needs: validate_and_test
    # ADR-014 No Auto-Rollout Policy:
    # Exige simultáneamente 4 condiciones estrictas:
    # 1. Invocación manual vía workflow_dispatch
    # 2. Ejecución exclusiva sobre la rama 'main' (refs/heads/main)
    # 3. Target explícito 'production'
    # 4. Confirmación manual escrita 'CONFIRM_PROD'
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.target_environment == 'production' &&
      github.event.inputs.confirm_production == 'CONFIRM_PROD'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Deploy Firebase Production Infrastructure
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "❌ ERROR: No se detectó el secreto FIREBASE_TOKEN para producción. Despliegue abortado."
            exit 1
          fi
          echo "🛡️ Desplegando a Producción (bluesystem-7c9af) bajo autorización ADR-014..."
          npx firebase-tools@13.31.0 deploy --project bluesystem-7c9af --only functions,firestore:rules,firestore:indexes,storage --token "$FIREBASE_TOKEN"
