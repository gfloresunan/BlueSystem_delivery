name: BlueSystem Enterprise Backend CI/CD Pipeline

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

jobs:
  validate_and_test:
    name: 🧪 Validate, Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd functions
          npm run build

  deploy_staging:
    name: 🚀 Deploy to Staging Environment
    needs: validate_and_test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Deploy to Firebase Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLUESYSTEM_STAGING }}'
          channelId: live
          projectId: bluesystem-7c9af-staging

  deploy_production:
    name: 🛡️ Deploy to Production (Manual Approval Gate)
    needs: validate_and_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Backend
        run: |
          cd functions
          npm ci
          npm run build

      - name: Deploy Firebase Production Infrastructure
        run: |
          npx firebase-tools deploy --only functions,firestore:rules,storage:rules --token "${{ secrets.FIREBASE_TOKEN }}"
