name: bluesystem_delivery_flutter
description: "BlueSystem Delivery Enterprise Multi-Platform Client Foundation (Android / iOS)"
publish_to: 'none'
version: 2.2.0+100

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Backend Services
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.6.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # Platform Capabilities & Adapters
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  flutter_local_notifications: ^16.3.2
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.1.0

  # Architecture, State & Utilities
  meta: ^1.11.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
